num_train_epochs: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 0.0002
warmup_ratio: 0.03
logging_steps: 20
save_steps: 500
max_seq_length: 1024
bf16: true
packing: false
report_to: none

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
