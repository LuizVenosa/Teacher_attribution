train_file: data/attribution/train_pairs.jsonl
val_file: data/attribution/val_pairs.jsonl
test_file: data/attribution/test_pairs.jsonl
output_dir: models/attribution_encoder/public_lineage_minilm_contrastive_ablation_base

max_length: 512
projection_dim: 128
temperature: 0.05
classification_weight: 0.2

# This is a high ceiling. Training stops early when validation accuracy plateaus.
num_epochs: 30
batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 0.00002
weight_decay: 0.01
warmup_ratio: 0.06
max_grad_norm: 1.0
mixed_precision: fp16
seed: 13

early_stopping_metric: accuracy
early_stopping_mode: max
early_stopping_patience: 6
early_stopping_min_delta: 0.002

eval_batch_size: 32
set_sizes: [1, 2, 4, 8, 16, 32, 64]
set_repeats: 20
