[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-attribution"
version = "0.1.0"
description = "Prompt-conditioned contrastive attribution for public teacher-student language-model pairs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "bert-score>=0.3.13",
  "datasets>=2.19",
  "evaluate>=0.4",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "protobuf>=4.25",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "sentence-transformers>=3.0",
  "sentencepiece>=0.2",
  "spacy>=3.7",
  "tiktoken>=0.7",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.44"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
