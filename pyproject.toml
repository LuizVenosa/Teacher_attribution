[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-attribution"
version = "0.3.0"
description = "Reproducible output-based model lineage experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6", "scikit-learn>=1.3"]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=5.12,<6", "sentencepiece>=0.2", "safetensors>=0.4"]
data = ["datasets>=2.19,<5", "pyarrow>=15"]
research = ["matplotlib>=3.8", "spacy>=3.8", "bert-score>=0.3.13", "rouge-score>=0.1.2", "accelerate>=1.0", "pillow>=10", "mistral-common>=1.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
teacher-attr = "teacher_attr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
