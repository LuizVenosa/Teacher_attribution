[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-attribution"
version = "0.1.0"
description = "Prompt-conditioned contrastive attribution for distilled language-model students."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "datasets>=2.19",
  "evaluate>=0.4",
  "numpy>=1.24",
  "pandas>=2.0",
  "peft>=0.11",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "sentence-transformers>=3.0",
  "spacy>=3.7",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.44",
  "trl>=0.9",
  "wandb>=0.16"
]

[project.optional-dependencies]
generation = ["vllm>=0.6"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
